syntax = "proto3";

package twilightproject.nyks.fragment;

option go_package = "github.com/twilight-project/nyks/x/fragment/types";

// Msg defines the Msg service.
service Msg {
  rpc SignerApplication (MsgSignerApplication) returns (MsgSignerApplicationResponse);
}

message MsgSignerApplication {
  string creator        = 1;
  int32  fragmentId     = 2;
  int32  applicationFee = 3;
  string btcPubKey      = 4;
  string signerAddress  = 5;
}

message MsgSignerApplicationResponse {}

